<script>
// ===================== Alapbeállítások =====================
const PX = 28;          // pixel / ütem (arrangement)
const RPX = 48;         // pixel / ütem (piano roll)
const RH = 12;          // pixel / félhang (piano roll)
const PMIN = 36, PMAX = 84;
const HDR_W = 330;

// ===================== Állapot =====================
let tracks = [];
let selTrack = 0, selClip = null, rollClip = null;
let bpm = 120;
let playing = false, recording = false;
let playFromBeat = 0, playStartT = 0, endTimer = null;
let sessionChans = {}, liveChans = {}, pendingRec = {};
let actx = null, bus = null;
const liveVoices = {};
let uid = 1;
let arrDrag = null, rollDrag = null;

// ===================== Segédfüggvények =====================
const beatSec = () => 60 / bpm;
const snap = b => Math.max(0, Math.round(b * 4) / 4);
const midiHz = n => 440 * Math.pow(2, (n - 69) / 12);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const endBeat = () => Math.max(0, ...tracks.flatMap(t => t.clips.map(c => c.start + c.len)));
const anySolo = () => tracks.some(t => t.solo);
const say = t => document.getElementById('status').textContent = t;
const currentBeat = () => playing ? playFromBeat + (actx.currentTime - playStartT) / beatSec() : playFromBeat;

function findClip(id){
  for (let i = 0; i < tracks.length; i++){
    const c = tracks[i].clips.find(c => c.id === id);
    if (c) return { c, ti: i };
  }
  return null;
}

function ac(){
  if (!actx){
    actx = new (window.AudioContext || window.webkitAudioContext)();
    bus = makeBus(actx, actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

// ===================== Hangrendszer =====================
function impulse(ctx, sec){
  const len = Math.floor(ctx.sampleRate * sec);
  const b = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++){
    const d = b.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  return b;
}

// Közös effekt-busz: delay és reverb küldések, mester
function makeBus(ctx, dest){
  const master = ctx.createGain(); master.gain.value = 0.8; master.connect(dest);

  const delayIn = ctx.createGain();
  const dl = ctx.createDelay(2); dl.delayTime.value = 0.375;
  const fb = ctx.createGain(); fb.gain.value = 0.4;
  const dOut = ctx.createGain(); dOut.gain.value = 0.7;
  delayIn.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(dOut); dOut.connect(master);

  const revIn = ctx.createGain();
  const conv = ctx.createConvolver(); conv.buffer = impulse(ctx, 2.5);
  const rOut = ctx.createGain(); rOut.gain.value = 0.6;
  revIn.connect(conv); conv.connect(rOut); rOut.connect(master);

  return { master, delayIn, revIn };
}

// Sáv-lánc: EQ -> kompresszor -> pan -> hangerő -> (küldések) -> busz
function makeChannel(ctx, b, tr, solo){
  const inp = ctx.createGain();
  const lo = ctx.createBiquadFilter(); lo.type = 'lowshelf';  lo.frequency.value = 200;  lo.gain.value = tr.eq[0];
  const mi = ctx.createBiquadFilter(); mi.type = 'peaking';   mi.frequency.value = 1000; mi.Q.value = 1; mi.gain.value = tr.eq[1];
  const hi = ctx.createBiquadFilter(); hi.type = 'highshelf'; hi.frequency.value = 5000; hi.gain.value = tr.eq[2];
  const cp = ctx.createDynamicsCompressor();
  cp.threshold.value = tr.comp ? -20 : 0;
  cp.ratio.value = tr.comp ? 4 : 1;
  cp.attack.value = 0.005; cp.release.value = 0.2;
  const pn = ctx.createStereoPanner(); pn.pan.value = tr.pan;
  const vol = ctx.createGain(); vol.gain.value = (tr.mute || (solo && !tr.solo)) ? 0 : tr.vol;
  const sdG = ctx.createGain(); sdG.gain.value = tr.sendD;
  const srG = ctx.createGain(); srG.gain.value = tr.sendR;

  inp.connect(lo); lo.connect(mi); mi.connect(hi); hi.connect(cp); cp.connect(pn); pn.connect(vol);
  vol.connect(b.master);
  vol.connect(sdG); sdG.connect(b.delayIn);
  vol.connect(srG); srG.connect(b.revIn);
  return { inp, out: vol };
}

// ----- Hangszerek -----
function noiseSource(ctx, dur){
  const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const b = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const s = ctx.createBufferSource(); s.buffer = b;
  return s;
}

function drumVoice(ctx, dest, note, vel, t){
  const v = vel * 0.9;
  if (note === 38 || note === 40){ // snare
    const n = noiseSource(ctx, 0.2);
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(v * 0.8, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    n.connect(f).connect(g).connect(dest); n.start(t); n.stop(t + 0.2);
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = 180;
    og.gain.setValueAtTime(v * 0.5, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(og).connect(dest); o.start(t); o.stop(t + 0.12);
  } else if (note >= 42 && note <= 46){ // hi-hat
    const n = noiseSource(ctx, 0.08);
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(v * 0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    n.connect(f).connect(g).connect(dest); n.start(t); n.stop(t + 0.08);
  } else if (note === 36 || note < 38){ // kick
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o.connect(g).connect(dest); o.start(t); o.stop(t + 0.45);
  } else { // tom / perc
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(midiHz(note) * 0.8, t); o.frequency.exponentialRampToValueAtTime(midiHz(note) * 0.5, t + 0.15);
    g.gain.setValueAtTime(v * 0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.connect(g).connect(dest); o.start(t); o.stop(t + 0.3);
  }
  return { release(){} };
}

const PRESET_CATS = [...new Set(PRESETS.map(p => p[0]))];

function applyPreset(tr, name){
  const p = PRESETS.find(x => x[1] === name);
  if (!p) return;
  const [, , w1, w2, mix, det, cut, q, atk, dec, sus, rel, fenv] = p;
  Object.assign(tr, { preset: name, wave: w1, wave2: w2, mix, detune: det,
                      cutoff: cut, q, atk, dec, sus, rel, fenv });
}

function synthVoice(ctx, dest, tr, note, vel, t){
  const peak = vel * 0.3;
  const sustainLvl = peak * tr.sus;
  const f = ctx.createBiquadFilter();
  f.type = 'lowpass';
  f.Q.value = tr.q;
  f.frequency.setValueAtTime(tr.cutoff, t);
  if (tr.fenv > 1){
    f.frequency.linearRampToValueAtTime(Math.min(16000, tr.cutoff * tr.fenv), t + Math.max(0.002, tr.atk));
    f.frequency.setTargetAtTime(tr.cutoff, t + tr.atk, Math.max(0.01, tr.dec));
  }
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + Math.max(0.002, tr.atk));
  g.gain.setTargetAtTime(sustainLvl, t + tr.atk, Math.max(0.01, tr.dec));
  f.connect(g).connect(dest);

  const oscs = [];
  const addOsc = (type, detune, amp) => {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.value = midiHz(note);
    o.detune.value = detune;
    const a = ctx.createGain(); a.gain.value = amp;
    o.connect(a).connect(f);
    o.start(t);
    oscs.push(o);
  };
  addOsc(tr.wave, 0, 1 - tr.mix);
  if (tr.mix > 0) addOsc(tr.wave2, tr.detune, tr.mix);

  return {
    release(r){
      const rt = Math.max(r, t + 0.01);
      g.gain.cancelScheduledValues(rt);
      g.gain.setTargetAtTime(0, rt, Math.max(0.01, tr.rel) / 4);
      const stopAt = rt + tr.rel * 1.5 + 0.05;
      oscs.forEach(o => o.stop(stopAt));
    }
  };
}

function voiceFor(ctx, dest, tr, note, vel, t){
  return tr.type === 'drums' ? drumVoice(ctx, dest, note, vel, t) : synthVoice(ctx, dest, tr, note, vel, t);
}

// ----- Klip-hangerő és fade -----
const clipLin = c => Math.pow(10, (c.gainDb || 0) / 20);

// Fade-szorzó a klipen belül (0..1) egy adott ütemnél
function fadeAt(c, b){
  const rel = b - c.start;
  let g = 1;
  if (c.fadeIn > 0 && rel < c.fadeIn) g = Math.max(0, rel / c.fadeIn);
  if (c.fadeOut > 0 && rel > c.len - c.fadeOut) g = Math.min(g, Math.max(0, (c.len - rel) / c.fadeOut));
  return g;
}

// A fade-töréspontok (ütemben)
function fadePoints(c){
  const pts = [c.start, c.start + (c.fadeIn || 0), c.start + c.len - (c.fadeOut || 0), c.start + c.len];
  return [...new Set(pts)].sort((a, b) => a - b);
}

// ----- Vágólap, vágás, másolás, beillesztés -----
let clipboard = null;

function cloneClip(c){
  return { ...c, id: uid++, notes: c.notes.map(n => ({ ...n })) };
}

function copyClip(){
  if (!selClip) return;
  clipboard = cloneClip(selClip);
  say('Klip másolva. Ctrl+V: beillesztés a lejátszófejhez (kijelölt sáv).');
}

function cutClip(){
  if (!selClip) return;
  copyClip();
  deleteClip();
}

function pasteClip(){
  if (!clipboard) return say('A vágólap üres.');
  const wantAudio = clipboard.kind === 'audio';
  let ti = selTrack;
  let tr = tracks[ti];
  // ha nincs megfelelő típusú sáv a kijelölt helyen, létrehozunk egyet
  if (!tr || (wantAudio ? tr.type !== 'audio' : tr.type === 'audio')){
    newTrack(wantAudio ? 'audio' : 'synth');
    ti = tracks.length - 1;
    tr = tracks[ti];
  }
  const c = cloneClip(clipboard);
  c.start = snap(currentBeat());
  tr.clips.push(c);
  selectClip(c, ti);
}

// Vágás a lejátszófejnél (Ctrl+E): a kijelölt klip két részre bomlik
function splitClip(){
  const f = selClip && findClip(selClip.id);
  if (!f) return say('Előbb jelölj ki egy klipet.');
  const c = f.c;
  const b = snap(currentBeat());
  if (b <= c.start || b >= c.start + c.len) return say('A lejátszófejnek a klipen belül kell állnia.');
  const cut = b - c.start;
  const right = cloneClip(c);
  right.start = b;
  right.len = c.len - cut;
  right.fadeIn = 0;
  c.len = cut;
  c.fadeOut = 0;
  if (c.kind === 'midi'){
    const leftN = [], rightN = [];
    for (const n of c.notes){
      const ne = n.s + n.l;
      if (n.s >= cut) rightN.push({ ...n, s: n.s - cut });
      else if (ne > cut){
        leftN.push({ ...n, l: cut - n.s });
        rightN.push({ ...n, s: 0, l: ne - cut });
      } else leftN.push(n);
    }
    c.notes = leftN;
    right.notes = rightN;
  } else {
    right.offset = (c.offset || 0) + cut * beatSec();
  }
  f.ti !== undefined && tracks[f.ti].clips.push(right);
  selClip = c;
  renderAll();
}

// ===================== Ütemezés (lejátszás és export) =====================
function scheduleProject(ctx, chans, fromBeat, t0){
  const bs = beatSec();
  for (const tr of tracks){
    const ch = chans[tr.id];
    if (!ch) continue;
    for (const c of tr.clips){
      if (c.start + c.len <= fromBeat) continue;
      const when = t0 + (c.start - fromBeat) * bs;

      if (c.kind === 'audio'){
        if (!c.buffer) continue;
        const src = ctx.createBufferSource();
        src.buffer = c.buffer;
        const gn = ctx.createGain();
        src.connect(gn).connect(ch.inp);
        const base = clipLin(c);
        gn.gain.setValueAtTime(base * fadeAt(c, Math.max(fromBeat, c.start)), t0);
        for (const pb of fadePoints(c)){
          if (pb <= fromBeat) continue;
          gn.gain.linearRampToValueAtTime(base * fadeAt(c, pb), t0 + (pb - fromBeat) * bs);
        }
        const off = (c.offset || 0) + Math.max(0, (fromBeat - c.start) * bs);
        const at = Math.max(t0, when);
        src.start(at, off);
        src.stop(t0 + (c.start + c.len - fromBeat) * bs);
      } else {
        for (const n of c.notes){
          const ns = c.start + n.s, ne = ns + n.l;
          if (ne <= fromBeat) continue;
          const at = Math.max(t0, t0 + (ns - fromBeat) * bs);
          const amp = clipLin(c) * fadeAt(c, ns);
          const v = voiceFor(ctx, ch.inp, tr, n.p, (n.v / 127) * amp, at);
          v.release(t0 + (ne - fromBeat) * bs);
        }
      }
    }
  }
}

// ===================== Lejátszás =====================
function play(){
  if (playing) return;
  const c = ac();
  playing = true;
  playStartT = c.currentTime + 0.05;
  sessionChans = {};
  const solo = anySolo();
  for (const tr of tracks) sessionChans[tr.id] = makeChannel(c, bus, tr, solo);
  scheduleProject(c, sessionChans, playFromBeat, playStartT);

  clearTimeout(endTimer);
  const remain = (endBeat() - playFromBeat) * beatSec();
  if (!recording && remain > 0){
    endTimer = setTimeout(() => { stopAll(); playFromBeat = 0; }, remain * 1000 + 500);
  }
  setBtns();
}

function stopAll(){
  if (!playing) return;
  playFromBeat = Math.max(0, currentBeat());
  playing = false;
  clearTimeout(endTimer);
  for (const k in sessionChans) sessionChans[k].out.disconnect();
  sessionChans = {};
  pendingRec = {};
  setBtns();
}

function setPos(b){
  const was = playing;
  if (was) stopAll();
  playFromBeat = Math.max(0, b);
  if (was) play();
}

function setBtns(){
  document.getElementById('playBtn').classList.toggle('on', playing);
  document.getElementById('recBtn').classList.toggle('on', recording);
}

// Lejátszófej animáció
const ph = document.getElementById('ph');
(function loop(){
  ph.style.left = (HDR_W + currentBeat() * PX) + 'px';
  requestAnimationFrame(loop);
})();

// ===================== Élő hangszólás =====================
function ensureLive(){
  const c = ac();
  const solo = anySolo();
  for (const tr of tracks)
    if (!liveChans[tr.id]) liveChans[tr.id] = makeChannel(c, bus, tr, solo);
}

function rebuildLive(){
  if (!actx) return;
  for (const k in liveChans) liveChans[k].out.disconnect();
  liveChans = {};
  ensureLive();
}

function liveOn(p, vel){
  const tr = tracks[selTrack];
  if (!tr || tr.type === 'audio') return;
  ensureLive();
  const c = ac();
  liveVoices[p] = voiceFor(c, liveChans[tr.id].inp, tr, p, vel, c.currentTime);
}

function liveOff(p){
  if (liveVoices[p]){
    liveVoices[p].release(actx.currentTime);
    delete liveVoices[p];
  }
}

function previewNote(p){
  liveOn(p, 0.7);
  setTimeout(() => liveOff(p), 250);
}

// ===================== MIDI felvétel =====================
function recOn(p, vel){
  if (!playing) return;
  const tr = tracks[selTrack];
  if (!tr || tr.type === 'audio') return;
  const b = snap(currentBeat());
  let c = tr.clips.find(c => c.kind === 'midi' && b >= c.start && b < c.start + c.len);
  if (!c) c = addClip(tr, Math.floor(b), 4);
  const n = { p, s: b - c.start, l: 0.25, v: Math.round(vel * 127) };
  c.notes.push(n);
  pendingRec[p] = { n, c, start: c.start + n.s };
  if (rollClip === c) drawRoll();
  renderArr();
}

function recOff(p){
  const pr = pendingRec[p];
  if (!pr) return;
  const end = snap(currentBeat());
  pr.n.l = Math.max(0.25, end - pr.start);
  fixClipLen(pr.c);
  delete pendingRec[p];
  if (rollClip === pr.c) drawRoll();
  renderArr();
}

function noteOn(p, vel){ liveOn(p, vel); recOn(p, vel); }
function noteOff(p){ liveOff(p); recOff(p); }

function setupMidi(){
  const ms = document.getElementById('midiStatus');
  if (!navigator.requestMIDIAccess){
    ms.textContent = 'MIDI: nem támogatott (használj Chrome vagy Edge böngészőt)';
    return;
  }
  navigator.requestMIDIAccess().then(acc => {
    const bind = () => {
      const names = [];
      for (const inp of acc.inputs.values()){
        inp.onmidimessage = onMidi;
        names.push(inp.name);
      }
      ms.textContent = 'MIDI: ' + (names.join(', ') || 'nincs eszköz');
    };
    bind();
    acc.onstatechange = bind;
  }).catch(() => { ms.textContent = 'MIDI: hozzáférés megtagadva'; });
}

function onMidi(e){
  const [st, d1, d2] = e.data;
  const cmd = st & 0xf0;
  if (cmd === 0x90 && d2 > 0) noteOn(d1, d2 / 127);
  else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) noteOff(d1);
}

// Számítógép-billentyűzet: A W S E D F T G Y H U J K = zongora, Z/X = oktáv
const KEYS = { a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12 };
let octBase = 60;
const held = {};
document.addEventListener('keydown', e => {
  if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.code === 'Space'){ e.preventDefault(); playing ? stopAll() : play(); return; }
  if ((e.ctrlKey || e.metaKey) && !e.altKey){
    const k = e.key.toLowerCase();
    if (k === 'c'){ e.preventDefault(); copyClip(); renderFx(); return; }
    if (k === 'x'){ e.preventDefault(); cutClip(); return; }
    if (k === 'v'){ e.preventDefault(); pasteClip(); return; }
    if (k === 'e'){ e.preventDefault(); splitClip(); return; }
  }
  if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); if (selClip) deleteClip(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    e.preventDefault();
    if (e.repeat) return;
    const dir = e.key === 'ArrowLeft' ? -1 : 1;
    jumpToClip(dir);
    // ha tartod a nyilat, folyamatosan húzza a fejet arra az irányba
    arrowHold = { dir, timer: setTimeout(() => startScrub(dir), 300) };
    return;
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){ e.preventDefault(); moveTrackSel(e.key === 'ArrowUp' ? -1 : 1); return; }
  if (e.key === 'Home'){ e.preventDefault(); setPos(0); renderAll(); return; }
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'z'){ octBase = Math.max(24, octBase - 12); return; }
  if (k === 'x'){ octBase = Math.min(84, octBase + 12); return; }
  if (Object.prototype.hasOwnProperty.call(KEYS, k) && !held[k]){
    held[k] = true;
    noteOn(octBase + KEYS[k], 0.8);
  }
});
// Nyilak: ← / → a kijelölt sáv klipjeinek elejére ugrik, ↑ / ↓ sávot vált, Home az elejére
function jumpToClip(dir){
  const tr = tracks[selTrack];
  const cur = currentBeat();
  const starts = tr ? tr.clips.map(c => c.start) : [];
  let target = null;
  if (dir < 0){
    const prev = starts.filter(s => s < cur - 0.01);
    target = prev.length ? Math.max(...prev) : 0;
  } else {
    const next = starts.filter(s => s > cur + 0.01);
    if (!next.length) return;
    target = Math.min(...next);
  }
  setPos(target);
  renderAll();
}

function moveTrackSel(dir){
  if (!tracks.length) return;
  selTrack = Math.max(0, Math.min(tracks.length - 1, selTrack + dir));
  renderAll();
}

// ----- Folyamatos léptetés nyíl tartásakor -----
let arrowHold = null, scrub = null, scrubRaf = null;

function startScrub(dir){
  if (scrub) return;
  scrub = { dir, beat: playFromBeat, last: performance.now(), wasPlaying: playing, speed: 6 };
  if (playing) stopAll();
  scrubLoop();
}

function scrubLoop(){
  if (!scrub) return;
  const now = performance.now();
  const dt = (now - scrub.last) / 1000;
  scrub.last = now;
  scrub.beat = Math.max(0, scrub.beat + scrub.dir * scrub.speed * dt);
  playFromBeat = scrub.beat;
  scrubRaf = requestAnimationFrame(scrubLoop);
}

function endScrub(){
  if (!scrub) return;
  cancelAnimationFrame(scrubRaf);
  const was = scrub.wasPlaying;
  scrub = null;
  playFromBeat = snap(playFromBeat);
  if (was) play();
  renderAll();
}

document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    if (arrowHold){ clearTimeout(arrowHold.timer); arrowHold = null; }
    endScrub();
    return;
  }
  const k = e.key.toLowerCase();
  if (Object.prototype.hasOwnProperty.call(KEYS, k) && held[k]){
    held[k] = false;
    noteOff(octBase + KEYS[k]);
  }
});

// ===================== Projekt-modell =====================
function newTrack(type){
  const names = { synth:'Szintí', drums:'Dob', audio:'Audio' };
  const t = {
    id: uid++, type, name: names[type] + ' ' + (tracks.filter(x => x.type === type).length + 1),
    vol: 0.8, pan: 0, mute: false, solo: false,
    eq: [0, 0, 0], comp: true, sendD: 0.15, sendR: 0.2,
    wave: 'sawtooth', wave2: 'sawtooth', mix: 0, detune: 0, cutoff: 2500, q: 1,
    atk: 0.01, dec: 0.3, sus: 0.7, rel: 0.3, fenv: 1, preset: '', clips: []
  };
  if (type === 'synth') applyPreset(t, 'Fűrész (alap)');
  tracks.push(t);
  selTrack = tracks.length - 1;
  return t;
}

function addClip(t, start, len, kind = 'midi'){
  const c = { id: uid++, start, len, kind, notes: [], name: kind === 'midi' ? 'MIDI' : 'Audio', buffer: null };
  t.clips.push(c);
  return c;
}

function fixClipLen(c){
  if (c.kind !== 'midi') return;
  let e = 0;
  for (const n of c.notes) e = Math.max(e, n.s + n.l);
  if (e > c.len) c.len = Math.ceil(e);
}

function selectClip(c, ti){
  selClip = c;
  selTrack = ti;
  rollClip = c.kind === 'midi' ? c : null;
  renderAll();
}

function deleteClip(){
  const f = selClip && findClip(selClip.id);
  if (!f) return;
  tracks[f.ti].clips = tracks[f.ti].clips.filter(x => x !== f.c);
  selClip = null; rollClip = null;
  renderAll();
}

// ===================== Arrangement nézet =====================
function renderArr(){
  const total = Math.max(64, endBeat() + 16);
  const W = total * PX;
  let h = `<div class="row ruler"><div class="hdr" style="background:var(--bg)"></div><div class="lane" data-ruler="1" style="width:${W}px">`;
  for (let b = 0; b < total; b += 4) h += `<span class="bar-n" style="left:${b * PX}px">${b / 4 + 1}</span>`;
  h += `</div></div>`;

  tracks.forEach((tr, i) => {
    const sel = i === selTrack;
    h += `
    <div class="row">
      <div class="hdr ${sel ? 'sel' : ''}" data-act="sel" data-ti="${i}">
        <div class="r1">
          <input type="text" value="${esc(tr.name)}" data-k="name" data-ti="${i}">
          <span style="color:#889;font-size:11px">${tr.type}</span>
          <button data-act="del" data-ti="${i}" title="Sáv törlése">✕</button>
        </div>
        <div class="r2">
          <button data-act="mute" data-ti="${i}" class="${tr.mute ? 'on' : ''}">Némít</button>
          <button data-act="solo" data-ti="${i}" class="${tr.solo ? 'on' : ''}">Solo</button>
          <label>Vol <input type="range" min="0" max="1" step="0.01" value="${tr.vol}" data-k="vol" data-ti="${i}"></label>
          <label>Pan <input type="range" min="-1" max="1" step="0.01" value="${tr.pan}" data-k="pan" data-ti="${i}"></label>
        </div>
      </div>
      <div class="lane ${sel ? 'sel' : ''}" data-lane="${i}" style="width:${W}px">`;
    for (const c of tr.clips){
      h += `<div class="clip ${c.kind} ${selClip === c ? 'selc' : ''}" data-cid="${c.id}"
              style="left:${c.start * PX}px;width:${c.len * PX - 2}px">${esc(c.name)}</div>`;
    }
    h += `</div></div>`;
  });

  document.getElementById('arrContent').innerHTML = h;
}

const content = document.getElementById('arrContent');

content.addEventListener('click', e => {
  if (e.target.tagName === 'INPUT') return;
  const act = e.target.closest('[data-act]');
  if (act){
    const ti = +act.dataset.ti;
    const tr = tracks[ti];
    const a = act.dataset.act;
    if (a === 'sel'){ selTrack = ti; renderAll(); }
    else if (a === 'mute'){ tr.mute = !tr.mute; rebuildLive(); renderArr(); }
    else if (a === 'solo'){ tr.solo = !tr.solo; rebuildLive(); renderArr(); }
    else if (a === 'del'){
      tracks.splice(ti, 1);
      selTrack = Math.max(0, Math.min(selTrack, tracks.length - 1));
      selClip = null; rollClip = null;
      renderAll();
    }
    return;
  }
  if (e.target.closest('.clip')) return;
  const lane = e.target.closest('.lane');
  if (!lane) return;
  const rect = lane.getBoundingClientRect();
  const b = Math.floor((e.clientX - rect.left) / PX);
  if (lane.dataset.lane !== undefined) selTrack = +lane.dataset.lane;
  setPos(b);
  renderAll();
});

content.addEventListener('dblclick', e => {
  const lane = e.target.closest('.lane');
  if (!lane || lane.dataset.lane === undefined || e.target.closest('.clip')) return;
  const ti = +lane.dataset.lane;
  const tr = tracks[ti];
  if (tr.type === 'audio') return;
  const rect = lane.getBoundingClientRect();
  const b = Math.floor((e.clientX - rect.left) / PX);
  const c = addClip(tr, b, 4);
  selectClip(c, ti);
});

content.addEventListener('mousedown', e => {
  const el = e.target.closest('.clip');
  if (!el) return;
  const f = findClip(+el.dataset.cid);
  if (!f) return;
  e.preventDefault();
  selectClip(f.c, f.ti);
  arrDrag = { c: f.c, x0: e.clientX, s0: f.c.start };
});

content.addEventListener('input', e => {
  const k = e.target.dataset.k;
  if (!k) return;
  const tr = tracks[+e.target.dataset.ti];
  if (k === 'name'){ tr.name = e.target.value; renderFx(); return; }
  tr[k] = +e.target.value;
  rebuildLive();
});

window.addEventListener('mousemove', e => {
  if (!arrDrag) return;
  const d = (e.clientX - arrDrag.x0) / PX;
  arrDrag.c.start = Math.max(0, Math.round(arrDrag.s0 + d));
  renderArr();
});
window.addEventListener('mouseup', () => {
  if (arrDrag){ arrDrag = null; renderArr(); }
});

// ===================== Effekt- és hangszerpanel =====================
function renderFx(){
  const el = document.getElementById('fx');
  const tr = tracks[selTrack];
  if (!tr){ el.innerHTML = ''; return; }
  const sl = (k, min, max, step, val, lbl) =>
    `<label>${lbl}<input type="range" data-fx="${k}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`;
  el.innerHTML = `
    <div class="lbl">Sáv: ${esc(tr.name)}</div>
    <div class="lbl">EQ</div>
    ${sl('eq0', -12, 12, 0.5, tr.eq[0], 'Mély (200 Hz)')}
    ${sl('eq1', -12, 12, 0.5, tr.eq[1], 'Közép (1 kHz)')}
    ${sl('eq2', -12, 12, 0.5, tr.eq[2], 'Magas (5 kHz)')}
    <label>Kompresszor <input type="checkbox" data-fx="comp" ${tr.comp ? 'checked' : ''}></label>
    <div class="lbl">Effekt küldés</div>
    ${sl('sendD', 0, 1, 0.01, tr.sendD, 'Delay')}
    ${sl('sendR', 0, 1, 0.01, tr.sendR, 'Reverb')}
    ${tr.type === 'synth' ? `
      <div class="lbl">Hangszín (${PRESETS.length} db)</div>
      <select data-fx="preset" style="width:100%">
        ${PRESET_CATS.map(cat => `<optgroup label="${cat}">
          ${PRESETS.filter(p => p[0] === cat).map(p => `<option value="${esc(p[1])}" ${p[1] === tr.preset ? 'selected' : ''}>${esc(p[1])}</option>`).join('')}
        </optgroup>`).join('')}
      </select>
      <div class="lbl">Részletes beállítás</div>
      ${sl('cutoff', 200, 8000, 10, tr.cutoff, 'Szűrő (Hz)')}
      ${sl('q', 0.5, 12, 0.1, tr.q, 'Rezonancia')}
      ${sl('atk', 0.001, 2, 0.001, tr.atk, 'Támadás (s)')}
      ${sl('dec', 0.01, 3, 0.01, tr.dec, 'Decay (s)')}
      ${sl('sus', 0, 1, 0.01, tr.sus, 'Sustain')}
      ${sl('rel', 0.01, 3, 0.01, tr.rel, 'Release (s)')}
      ${sl('fenv', 1, 10, 0.1, tr.fenv, 'Szűrő-boríték')}
      ${sl('mix', 0, 1, 0.01, tr.mix, '2. oszcillátor')}
      ${sl('detune', -50, 50, 1, tr.detune, '2. hangolás (cent)')}` : ''}
    ${selClip ? `<div class="lbl">Kijelölt klip: ${esc(selClip.name)}</div>
      ${sl('c_gainDb', -24, 12, 0.5, selClip.gainDb || 0, 'Hangerő (dB)')}
      ${sl('c_fadeIn', 0, 4, 0.05, selClip.fadeIn || 0, 'Fade in (ütem)')}
      ${sl('c_fadeOut', 0, 4, 0.05, selClip.fadeOut || 0, 'Fade out (ütem)')}
      <div class="lbl">Ctrl+C / Ctrl+X / Ctrl+V: másol / vág / beilleszt · Ctrl+E: vágás a lejátszófejnél · Delete: törlés</div>
      <button id="delClip">Klip törlése</button>
      <button id="copyClipBtn">Másolás</button>` : ''}
  `;
}

const fxEl = document.getElementById('fx');
function fxChange(e){
  const k = e.target.dataset.fx;
  if (!k) return;
  const tr = tracks[selTrack];
  if (!tr) return;
  const v = e.target.type === 'checkbox' ? e.target.checked
          : e.target.type === 'range' ? +e.target.value
          : e.target.value;
  if (k.startsWith('c_')){ if (selClip){ selClip[k.slice(2)] = v; renderArr(); } return; }
  if (k === 'preset'){ applyPreset(tr, v); rebuildLive(); renderFx(); return; }
  if (k.startsWith('eq')) tr.eq[+k[2]] = v;
  else if (k === 'cutoff') tr.cutoff = v;
  else if (k === 'wave') tr.wave = v;
  else tr[k] = v;
  rebuildLive();
}
fxEl.addEventListener('input', fxChange);
fxEl.addEventListener('change', fxChange);
fxEl.addEventListener('click', e => {
  if (e.target.id === 'delClip') deleteClip();
  if (e.target.id === 'copyClipBtn') copyClip();
});

// ===================== Piano roll =====================
const cv = document.getElementById('roll');
const cx = cv.getContext('2d');

function drawRoll(){
  if (!rollClip){
    cv.width = 500; cv.height = 60;
    cx.fillStyle = '#16181c'; cx.fillRect(0, 0, 500, 60);
    cx.fillStyle = '#889'; cx.font = '12px system-ui';
    cx.fillText('Kattints egy MIDI klipre az idővonalon a piano roll megnyitásához', 10, 32);
    return;
  }
  const W = Math.max(500, rollClip.len * RPX + 40);
  const H = (PMAX - PMIN + 1) * RH;
  cv.width = W; cv.height = H;
  for (let r = 0; r <= PMAX - PMIN; r++){
    const p = PMAX - r, y = r * RH;
    const black = [1,3,6,8,10].includes(p % 12);
    cx.fillStyle = black ? '#1d2026' : '#2a2e37';
    cx.fillRect(0, y, W, RH);
    cx.fillStyle = '#333842';
    cx.fillRect(0, y + RH - 1, W, 1);
  }
  for (let q = 0; q <= rollClip.len * 4; q++){
    const x = q * RPX / 4;
    cx.fillStyle = q % 16 === 0 ? '#8a8f99' : q % 4 === 0 ? '#555c68' : '#353b46';
    cx.fillRect(x, 0, 1, H);
  }
  for (const n of rollClip.notes){
    cx.fillStyle = '#e0a030';
    cx.fillRect(n.s * RPX + 1, (PMAX - n.p) * RH + 1, n.l * RPX - 2, RH - 2);
  }
}

const rollPos = e => {
  const r = cv.getBoundingClientRect();
  return { beat: (e.clientX - r.left) / RPX, p: PMAX - Math.floor((e.clientY - r.top) / RH) };
};

function afterRoll(){
  if (rollClip) fixClipLen(rollClip);
  drawRoll();
  renderArr();
}

cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mousedown', e => {
  if (!rollClip) return;
  const { beat, p } = rollPos(e);
  if (p < PMIN || p > PMAX) return;
  let hit = null;
  for (let i = rollClip.notes.length - 1; i >= 0; i--){
    const n = rollClip.notes[i];
    if (n.p === p && beat >= n.s && beat < n.s + n.l){ hit = n; break; }
  }
  if (e.button === 2 || e.shiftKey){
    if (hit){
      rollClip.notes = rollClip.notes.filter(x => x !== hit);
      afterRoll();
    }
    return;
  }
  if (hit){
    rollDrag = beat > hit.s + hit.l - 0.25
      ? { mode: 'resize', n: hit }
      : { mode: 'move', n: hit, off: beat - hit.s };
  } else {
    const n = { p, s: snap(beat), l: 1, v: 100 };
    rollClip.notes.push(n);
    rollDrag = { mode: 'resize', n };
    previewNote(p);
  }
  drawRoll();
});

window.addEventListener('mousemove', e => {
  if (!rollDrag) return;
  const { beat, p } = rollPos(e);
  const n = rollDrag.n;
  if (rollDrag.mode === 'move'){
    n.s = snap(beat - rollDrag.off);
    n.p = Math.min(PMAX, Math.max(PMIN, p));
  } else {
    n.l = Math.max(0.25, snap(beat) - n.s);
  }
  drawRoll();
});
window.addEventListener('mouseup', () => {
  if (rollDrag){ rollDrag = null; afterRoll(); }
});

// ===================== Audio import =====================
document.getElementById('addAudio').onclick = () => document.getElementById('audioFile').click();
document.getElementById('audioFile').onchange = async e => {
  const c = ac();
  const startBeat = Math.floor(currentBeat());
  for (const f of e.target.files){
    try {
      const buf = await c.decodeAudioData(await f.arrayBuffer());
      const t = newTrack('audio');
      t.name = f.name.replace(/\.[^.]+$/, '').slice(0, 16);
      const cl = addClip(t, startBeat, Math.max(0.25, buf.duration / beatSec()), 'audio');
      cl.name = t.name;
      cl.buffer = buf;
    } catch (err){
      say('Nem sikerült betölteni: ' + f.name);
    }
  }
  e.target.value = '';
  renderAll();
};

// ===================== MP3 export (offline render) =====================
async function exportMp3(){
  if (typeof lamejs === 'undefined'){ say('Az MP3 enkóder nem töltődött be (internet?).'); return; }
  if (endBeat() <= 0){ say('Nincs mit exportálni.'); return; }
  say('Renderelés…');
  try {
    const sr = 44100;
    const dur = endBeat() * beatSec() + 3;
    const off = new OfflineAudioContext(2, Math.ceil(sr * dur), sr);
    const ob = makeBus(off, off.destination);
    const solo = anySolo();
    const chans = {};
    for (const tr of tracks) chans[tr.id] = makeChannel(off, ob, tr, solo);
    scheduleProject(off, chans, 0, 0);
    const buf = await off.startRendering();

    say('MP3 kódolás…');
    await new Promise(r => setTimeout(r, 20));

    const L = buf.getChannelData(0);
    const R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
    const l16 = new Int16Array(L.length), r16 = new Int16Array(R.length);
    for (let i = 0; i < L.length; i++){
      l16[i] = Math.max(-1, Math.min(1, L[i])) * 32767;
      r16[i] = Math.max(-1, Math.min(1, R[i])) * 32767;
    }
    const enc = new lamejs.Mp3Encoder(2, sr, 192);
    const out = [];
    const blk = 1152;
    for (let i = 0; i < l16.length; i += blk){
      const chunk = enc.encodeBuffer(l16.subarray(i, i + blk), r16.subarray(i, i + blk));
      if (chunk.length) out.push(chunk);
    }
    const end = enc.flush();
    if (end.length) out.push(end);

    download(new Blob(out, { type: 'audio/mpeg' }), 'dal_' + bpm + 'bpm.mp3');
    say('Kész – az MP3 letöltődött.');
  } catch (e){
    console.error(e);
    say('Hiba az exportálás közben: ' + e.message);
  }
}

function download(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// ===================== Projekt mentés / betöltés =====================
document.getElementById('saveJson').onclick = () => {
  const data = {
    bpm,
    tracks: tracks.filter(t => t.type !== 'audio').map(t => ({
      ...t,
      clips: t.clips.filter(c => c.kind === 'midi').map(c => ({ ...c }))
    }))
  };
  download(new Blob([JSON.stringify(data)], { type: 'application/json' }), 'projekt.json');
  say('Mentve. (Az audio klipek nem mentődnek – csak a MIDI és a beállítások.)');
};

document.getElementById('loadBtn').onclick = () => document.getElementById('loadJson').click();
document.getElementById('loadJson').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  const d = JSON.parse(await f.text());
  bpm = d.bpm || 120;
  document.getElementById('bpm').value = bpm;
  tracks = d.tracks.filter(t => t.type !== 'audio');
  // régi projektek hangszínmező-hiányának pótlása
  for (const t of tracks) if (t.type === 'synth' && t.atk === undefined) applyPreset(t, 'Fűrész (alap)');
  uid = Math.max(uid, ...tracks.flatMap(t => [t.id, ...t.clips.map(c => c.id)])) + 1;
  for (const k in liveChans) liveChans[k].out.disconnect();
  liveChans = {};
  selTrack = 0; selClip = null; rollClip = null;
  e.target.value = '';
  renderAll();
};

// ===================== Gombok és alapesemények =====================
function renderAll(){
  renderArr();
  renderFx();
  drawRoll();
}

document.getElementById('playBtn').onclick = () => playing ? stopAll() : play();
document.getElementById('stopBtn').onclick = () => stopAll();
document.getElementById('toStart').onclick = () => setPos(0);
document.getElementById('recBtn').onclick = () => { recording = !recording; setBtns(); };
document.getElementById('addSynth').onclick = () => { newTrack('synth'); renderAll(); };
document.getElementById('addDrum').onclick = () => { newTrack('drums'); renderAll(); };
document.getElementById('exportMp3').onclick = exportMp3;
document.getElementById('bpm').onchange = e => { bpm = +e.target.value || 120; };
